      - "TNT:16"
      - "END_CRYSTAL:4"
      - "ANCIENT_DEBRIS:2"
      - "CRYING_OBSIDIAN:16"

      # Special
      - "TOTEM_OF_UNDYING:2"
      - "ENDER_PEARL:8"
      - "ENCHANTED_BOOK:3"
      - "WIND_CHARGE:16"

# ===========================================
# CHEST SPAWN SETTINGS
# ===========================================
chests:
  spawn-interval: 60  # seconds between chest spawns
  max-chests: 10      # maximum chests in arena at once
  despawn-time: 120   # seconds before chest despawns

# ===========================================
# GAME MODE SPECIFIC SETTINGS
# ===========================================
game-modes:
  swapper:
    interval: 30 # seconds between position swaps

  shuffle:
    interval: 60 # seconds between inventory shuffles

  lava-rising:
    rise-interval: 10 # seconds per lava layer rise

  border-shrink:
    shrink-time: 300  # total seconds to shrink (5 minutes)
    final-size: 20    # final border size in blocks

  speed-uhc:
    speed-level: 1 # Speed potion amplifier (0 = Speed I, 1 = Speed II)

  tnt-rain:
    spawn-interval: 5 # seconds between TNT spawns
    min-tnt: 1
    max-tnt: 3

# ===========================================
# ARENA SETTINGS
# ===========================================
arena:
  default-cage-material: GLASS
  cage-size: 3 # 3x3x3 cage around spawn points
  max-cages: 20 # Maximum number of cages per arena

# ===========================================
# LOBBY SETTINGS
# ===========================================
lobby:
  world: world
  x: 0.5
  y: 100.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

# ===========================================
# MESSAGES
# ===========================================
# Supports MiniMessage format
# Colors: <red>, <green>, <blue>, <yellow>, <gold>, <aqua>, <white>, <gray>, etc.
# Formatting: <bold>, <italic>, <underlined>, <strikethrough>
# Gradients: <gradient:#COLOR1:#COLOR2>text</gradient>
# Hover/Click: <hover:show_text:'text'>, <click:run_command:'/cmd'>
messages:
  prefix: "<gradient:#FFD700:#FFA500><bold>FortunePillars</bold></gradient> <dark_gray>»</dark_gray> "

# ===========================================
# COSMETICS
# ===========================================
cosmetics:
  enabled: true
  win-fireworks: true
  firework-count: 5

# ===========================================
# CHAT SETTINGS
# ===========================================
chat:
  # Set to false to disable arena-specific chat formatting
  # Players will use normal server chat even in arenas
  arena-chat-enabled: false

  # States where arena chat is active (only if enabled above)
  arena-chat-states:
    - WAITING
    - STARTING
    - IN_GAME

# ===========================================
# SOUND SETTINGS
# ===========================================
# All sounds are fully configurable here.
#
# sound: The Bukkit sound name (ALL_CAPS)
#   Full list: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Sound.html
#   Set to "none" or leave empty to disable a specific sound
#
# volume: How loud (0.0 = silent, 1.0 = normal, 2.0 = loud)
#   Note: Players only hear sounds within a certain radius based on volume
#
# pitch: How high/low the sound is (0.5 = very low, 1.0 = normal, 2.0 = very high)
#
# enabled: Set to false to disable this specific sound
#
sounds:
  # Master toggle - set false to disable ALL sounds
  enabled: true

  # GUI click sound (buttons, menus)
  click:
    sound: UI_BUTTON_CLICK
    volume: 0.5
    pitch: 1.0
    enabled: true

  # Success/positive action
  success:
    sound: ENTITY_PLAYER_LEVELUP
    volume: 0.7
    pitch: 1.2
    enabled: true

  # Error/denied action
  error:
    sound: ENTITY_VILLAGER_NO
    volume: 0.7
    pitch: 1.0
    enabled: true

  # Countdown tick (every second)
  countdown:
    sound: BLOCK_NOTE_BLOCK_PLING
    volume: 1.0
    pitch: 1.0
    enabled: true

  # Countdown final seconds (last 5)
  countdown-final:
    sound: BLOCK_NOTE_BLOCK_PLING
    volume: 1.0
    pitch: 2.0
    enabled: true

  # Countdown cancelled / not enough players
  countdown-stop:
    sound: BLOCK_NOTE_BLOCK_BASS
    volume: 1.0
    pitch: 0.8
    enabled: true

  # Game starts
  game-start:
    sound: ENTITY_ENDER_DRAGON_GROWL
    volume: 0.5
    pitch: 1.5
    enabled: true

  # Game ends (for all players)
  game-end:
    sound: UI_TOAST_CHALLENGE_COMPLETE
    volume: 1.0
    pitch: 0.8
    enabled: true

  # Player eliminated
  elimination:
    sound: ENTITY_WITHER_SPAWN
    volume: 0.3
    pitch: 1.5
    enabled: true

  # Winner victory sound
  victory:
    sound: UI_TOAST_CHALLENGE_COMPLETE
    volume: 1.0
    pitch: 1.0
    enabled: true

  # Loot received by player
  loot-received:
    sound: ENTITY_ITEM_PICKUP
    volume: 0.5
    pitch: 1.2
    enabled: true

  # Loot drops into arena
  loot-drop:
    sound: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 0.8
    pitch: 1.0
    enabled: true

  # Player teleported
  teleport:
    sound: ENTITY_ENDERMAN_TELEPORT
    volume: 1.0
    pitch: 1.0
    enabled: true

  # Warning (border, lava, etc.)
  warning:
    sound: BLOCK_NOTE_BLOCK_BASS
    volume: 1.0
    pitch: 0.5
    enabled: true

  # Player joins arena
  join-arena:
    sound: ENTITY_PLAYER_LEVELUP
    volume: 0.5
    pitch: 1.0
    enabled: true

  # Player leaves arena
  leave-arena:
    sound: ENTITY_ENDERMAN_TELEPORT
    volume: 0.5
    pitch: 0.8
    enabled: true

  # Grace period ends (PvP enabled)
  grace-period-end:
    sound: ENTITY_ENDER_DRAGON_GROWL
    volume: 0.4
    pitch: 1.2
    enabled: true

  # Player becomes spectator
  spectate:
    sound: ENTITY_BAT_TAKEOFF
    volume: 0.7
    pitch: 1.0
    enabled: true

  # Player casts a vote
  vote:
    sound: UI_BUTTON_CLICK
    volume: 0.6
    pitch: 1.3
    enabled: true

# ===========================================
# SCOREBOARD SETTINGS
# ===========================================
scoreboard:
  # Enable/disable scoreboard globally
  enabled: true

  # Scoreboard title (supports MiniMessage format)
  title: "<gradient:#FFD700:#FFA500><bold>FortunePillars</bold></gradient>"

  # Update interval in ticks (20 ticks = 1 second)
  # Lower = more frequent updates (may cause lag)
  # Higher = less frequent updates (better performance)
  update-interval: 20

  # Scoreboard lines (supports MiniMessage + placeholders)
  # Available placeholders:
  #   {arena} - Arena name
  #   {state} - Game state (colored)
  #   {mode} - Game mode name
  #   {time} - Game time (MM:SS)
  #   {alive} - Alive player count
  #   {spectators} - Spectator count
  #   {total} - Total players
  #   {kills} - Player's kills (only shown if alive)
  #   {spectator_text} - Shows "👁 Spectating" if player is spectator
  #   {loot_mode} - Current loot mode
  lines:
    - ""
    - "<gray>Arena: <white>{arena}"
    - ""
    - "<gray>Status: {state}"
    - "<gray>Mode: <yellow>{mode}"
    - " "
    - "<gray>Time: <white>{time}"
    - "  "
    - "<gray>Alive: <green>{alive}"
    - "<gray>Spectating: <yellow>{spectators}"
    - "<gray>Total: <white>{total}"
    - "   "
    - "<gray>Your Kills: <red>{kills}"
    - "    "
    - "{spectator_text}"
    - "     "
    - "<gold>play.yourserver.com"

# ===========================================
# DEBUG SETTINGS
# ===========================================
debug:
  # Enable verbose logging (shows detailed manager info)
  verbose: false

  # Log loot drops (for debugging loot system)
  log-loot-drops: false

  # Log game state changes
  log-state-changes: false

  # Log schematic operations (save/restore progress)
  verbose-schematics: false

