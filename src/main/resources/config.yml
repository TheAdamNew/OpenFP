# ===========================================
# FortunePillars Configuration
# Compatible with Paper 1.21x
# ===========================================
#
# 🎮 Official Discord: https://discord.gg/xctckUQukB
# 📚 Need help? Join our community for support!
#
# ===========================================

# Database Settings
database:
  type: sqlite # sqlite or mysql
  mysql:
    host: localhost
    port: 3306
    database: fortunepillars
    username: root
    password: password
    pool-size: 10

# Game Settings
game:
  min-players: 2
  max-players: 8
  countdown-seconds: 30
  grace-period-seconds: 10 # No PvP at start

# ===========================================
# VOTING SYSTEM
# ===========================================
voting:
  # Set to false to skip voting entirely and start game immediately
  # with the arena's default game mode and default loot mode
  enabled: true

# ===========================================
# NOTIFICATIONS
# ===========================================
notifications:
  # Chat notifications (broadcast messages in chat)
  chat:
    # Master toggle for ALL chat notifications sent by the plugin
    enabled: true

    # Individual notification toggles (only matter if chat.enabled = true)
    player-join: true           # "{player} joined arena ({current}/{max})"
    player-leave: true          # "You left the arena."
    countdown: true             # "Game starting in X seconds!"
    game-started: true          # "GAME STARTED!"
    game-ended: true            # "GAME OVER!"
    player-eliminated: true     # "{player} eliminated! (X left)"
    player-won: true            # "{player} wins!"
    grace-period-start: true    # "Grace period active!"
    grace-period-end: true      # "PVP ENABLED!"
    vote-cast: true             # "{player} voted for ..."
    game-settings: true         # Game mode/loot mode info at game start
    arena-restored: true        # "Arena X is ready for the next game!"
    no-schematic-error: true    # "Arena X cannot regenerate - no schematic!"
    not-enough-players: true    # "Not enough players!"
    swapper-warning: true       # "Positions swapping in 5 seconds!"
    swapper-swap: true          # "SWAP!"
    shuffle-warning: true       # "Inventories shuffling in 5 seconds!"
    shuffle-shuffle: true       # "SHUFFLE!"
    loot-drop-countdown: true    # "Next loot drop in X seconds!"
    loot-drop: true              # "Loot Drop! (X normal items)"
    loot-received: true          # Personal pickup msg

  # Countdown Boss Bar
  bossbar:
    # Show countdown as a boss bar during STARTING phase
    enabled: false
    color: YELLOW               # PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
    style: PROGRESS             # PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12, NOTCHED_20

  # Countdown Action Bar
  actionbar:
    # Show countdown as action bar during STARTING phase
    enabled: false

# ===========================================
# LOOT SETTINGS
# ===========================================
loot:
  interval-min: 3 # seconds between loot drops (minimum)
  interval-max: 5 # seconds between loot drops (maximum)
  items-min: 1    # minimum items per drop
  items-max: 3    # maximum items per drop
  include-spawn-eggs: true

  # ========================
  # DEFAULT LOOT MODE
  # ========================
  # Used when no players vote for a loot mode
  #
  # FULL OPTIONS:
  #   SINGLE_NORMAL_SLOW, SINGLE_NORMAL_MEDIUM, SINGLE_NORMAL_FAST
  #   SINGLE_BALANCED_SLOW, SINGLE_BALANCED_MEDIUM, SINGLE_BALANCED_FAST
  #   SINGLE_OP_SLOW, SINGLE_OP_MEDIUM, SINGLE_OP_FAST
  #   MULTI_NORMAL_SLOW, MULTI_NORMAL_MEDIUM, MULTI_NORMAL_FAST
  #   MULTI_BALANCED_SLOW, MULTI_BALANCED_MEDIUM, MULTI_BALANCED_FAST
  #   MULTI_OP_SLOW, MULTI_OP_MEDIUM, MULTI_OP_FAST
  #
  # SHORTHAND OPTIONS (defaults to MEDIUM timing):
  #   SINGLE, MULTI (defaults to NORMAL tier)
  #   SINGLE_NORMAL, SINGLE_BALANCED, SINGLE_OP
  #   MULTI_NORMAL, MULTI_BALANCED, MULTI_OP
  #   NORMAL, BALANCED, OP (defaults to MULTI style)
  #
  default-loot-mode: "SINGLE_NORMAL_MEDIUM"

  # ========================
  # CUSTOM LOOT CONFIGURATION GUIDE
  # ========================
  #
  # 📖 HOW TO ADD/EDIT/REMOVE LOOT ITEMS:
  #
  # ✅ TO ADD NEW ITEMS:
  #    1. Uncomment the tier section (remove the #)
  #    2. Add your item using the format below
  #    3. Save and run /tof reload
  #
  # ✅ TO EDIT EXISTING ITEMS:
  #    1. Find the item in the 'remove-defaults' section
  #    2. Add it to remove list to disable default
  #    3. Add your custom version in 'custom-items' with new values
  #
  # ✅ TO REMOVE DEFAULT ITEMS:
  #    1. Add the material name to the 'remove-defaults' list
  #    2. Default items with that material will NOT spawn
  #
  # 📋 ITEM FORMAT:
  #    "MATERIAL"                           → 1 item, weight 10 (default)
  #    "MATERIAL:amount"                    → specific amount, weight 10
  #    "MATERIAL:amount:weight"             → amount + custom weight
  #    "MATERIAL:minAmount:maxAmount:weight" → random range + weight
  #
  # 💡 WEIGHT SYSTEM:
  #    - Higher weight = more common
  #    - Weight 1 = very rare (0.5-1% chance)
  #    - Weight 5 = rare (2-5% chance)
  #    - Weight 10 = common (5-10% chance)
  #    - Weight 15 = very common (10-15% chance)
  #
  # 🎯 EXAMPLES:
  #    "DIAMOND:1:2"              → 1 diamond, weight 2 (rare)
  #    "COBBLESTONE:32:64:15"     → 32-64 cobblestone, weight 15 (very common)
  #    "NETHERITE_INGOT:1:1:1"    → 1 netherite, weight 1 (extremely rare)
  #    "IRON_INGOT:4:12:8"        → 4-12 iron, weight 8 (common)
  #    "GOLDEN_APPLE:2:4:5"       → 2-4 golden apples, weight 5 (uncommon)
  #
  # 🚫 REMOVE DEFAULT ITEMS:
  #    Just add the material name to remove it from drops:
  #
  #    remove-defaults:
  #      normal:
  #        - "WOODEN_SWORD"    # Removes all wooden swords from normal tier
  #        - "LEATHER_HELMET"  # Removes leather helmets
  #        - "DIRT"            # Removes dirt
  #
  # ⚠️ IMPORTANT NOTES:
  #    - Material names MUST be valid Minecraft materials (case-sensitive)
  #    - Check valid materials: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
  #    - Weights don't need to add up to 100 (they're relative)
  #    - Use /tof reload after making changes
  #    - Items in 'all' tier will appear in EVERY tier
  #
  # 💬 Need Help? Join Discord: https://discord.gg/xctckUQukB
  #
  # ========================

  # Remove specific default items from loot tables
  # Add material names here to prevent them from spawning
  remove-defaults:
    normal: []
      # Example: Remove wooden tools and leather armor from normal tier
      # - "WOODEN_SWORD"
      # - "WOODEN_AXE"
      # - "LEATHER_HELMET"
      # - "LEATHER_CHESTPLATE"
      # - "LEATHER_LEGGINGS"
      # - "LEATHER_BOOTS"
      # - "DIRT"
    # - "COBBLESTONE"

    balanced: []
      # Example: Remove specific items from balanced tier
      # - "STONE_SWORD"
    # - "CHAINMAIL_HELMET"

    op: []
      # Example: Remove items from OP tier
      # - "DIAMOND_HELMET"
    # - "NETHERITE_SCRAP"

    all: []
      # Removes from ALL tiers (normal, balanced, and op)
      # - "SNOWBALL"
    # - "EGG"

  # Custom items to ADD to loot tables
  custom-items:
    # Items added ONLY to Normal tier
    normal: []
      # Example: Add custom normal tier items
      # - "STONE_PICKAXE:1:8"          # 1 stone pickaxe, weight 8
      # - "COOKED_SALMON:4:8:10"       # 4-8 cooked salmon, weight 10
    # - "TORCH:16:32:12"             # 16-32 torches, weight 12

    # Items added ONLY to Balanced tier
    balanced: []
      # Example: Add custom balanced tier items
      # - "IRON_INGOT:4:8:6"           # 4-8 iron ingots, weight 6
      # - "GOLD_INGOT:2:6:5"           # 2-6 gold ingots, weight 5
    # - "ENDER_PEARL:1:3:4"          # 1-3 ender pearls, weight 4

    # Items added ONLY to OP tier
    op: []
      # Example: Add custom OP tier items
      # - "DIAMOND:2:6:4"              # 2-6 diamonds, weight 4
      # - "NETHERITE_INGOT:1:2:2"      # 1-2 netherite ingots, weight 2
      # - "ENCHANTED_GOLDEN_APPLE:1:2:3" # 1-2 god apples, weight 3
    # - "TOTEM_OF_UNDYING:1:1"       # 1 totem, weight 1 (very rare)

    # Items added to ALL tiers (normal, balanced, AND op)
    all: []
      # Example: Universal items that appear everywhere
      # - "WATER_BUCKET:1:6"           # 1 water bucket, weight 6
      # - "GOLDEN_APPLE:1:2:5"         # 1-2 golden apples, weight 5
    # - "ENDER_PEARL:1:4"            # 1 ender pearl, weight 4

  # ========================
  # EXAMPLE CONFIGURATION
  # ========================
  # Here's a complete example setup:
  #
  # remove-defaults:
  #   normal:
  #     - "WOODEN_SWORD"      # Remove weak wooden sword
  #     - "DIRT"              # Remove dirt from loot
  #   balanced:
  #     - "CHAINMAIL_HELMET"  # Remove chainmail from balanced
  #   op:
  #     - "DIAMOND_HELMET"    # Make OP tier harder
  #
  # custom-items:
  #   normal:
  #     - "STONE_SWORD:1:12"         # Add more stone swords
  #     - "BREAD:8:16:15"            # Add lots of bread
  #   balanced:
  #     - "IRON_SWORD:1:10"          # Better weapons in balanced
  #     - "IRON_INGOT:4:12:8"        # More iron for crafting
  #   op:
  #     - "DIAMOND_SWORD:1:8"        # More diamond swords
  #     - "NETHERITE_INGOT:1:1:3"    # Rare netherite
  #   all:
  #     - "GOLDEN_APPLE:1:5"         # Golden apples in all modes
  #     - "WATER_BUCKET:1:6"         # Water buckets everywhere
  #
  # ========================

  # ========================
  # LOOT TABLES (LEGACY)
  # ========================
  # ⚠️ DEPRECATION WARNING:
  # These old-style loot tables are being phased out.
  # Use 'custom-items' and 'remove-defaults' above instead.
  # These sections will be removed in a future version.
  #
  # These are kept for backward compatibility but won't
  # affect loot if you use the new system above.
  # ========================

  normal:
    common:
      # Weapons
      - "STONE_SWORD:1"
      - "WOODEN_SWORD:1"
      - "WOODEN_AXE:1"

      # Armor
      - "LEATHER_HELMET:1"
      - "LEATHER_CHESTPLATE:1"
      - "LEATHER_LEGGINGS:1"
      - "LEATHER_BOOTS:1"

      # Food
      - "COOKED_BEEF:8"
      - "BREAD:16"
      - "APPLE:4"
      - "COOKED_CHICKEN:8"

      # Blocks
      - "OAK_PLANKS:32"
      - "COBBLESTONE:32"
      - "DIRT:16"
      - "SAND:16"
      - "GRAVEL:16"
      - "GLASS:16"
      - "OAK_LOG:8"
      - "STONE:16"
      - "STONE_BRICKS:16"
      - "BRICKS:16"
      - "WHITE_WOOL:16"
      - "LADDER:8"
      - "SCAFFOLDING:16"

      # Projectiles
      - "ARROW:16"
      - "SNOWBALL:8"
      - "EGG:8"

      # Redstone
      - "REDSTONE:8"
      - "LEVER:2"
      - "PISTON:2"

    uncommon:
      # Weapons
      - "IRON_SWORD:1"
      - "IRON_AXE:1"
      - "BOW:1"

      # Armor
      - "IRON_HELMET:1"
      - "IRON_CHESTPLATE:1"
      - "IRON_LEGGINGS:1"
      - "IRON_BOOTS:1"
      - "CHAINMAIL_HELMET:1"
      - "CHAINMAIL_CHESTPLATE:1"
      - "CHAINMAIL_LEGGINGS:1"
      - "CHAINMAIL_BOOTS:1"

      # Tools
      - "IRON_PICKAXE:1"
      - "FISHING_ROD:1"
      - "FLINT_AND_STEEL:1"
      - "SHIELD:1"

      # Food
      - "GOLDEN_APPLE:2"
      - "GOLDEN_CARROT:4"

      # Blocks
      - "IRON_BLOCK:4"
      - "OBSIDIAN:8"
      - "SLIME_BLOCK:8"
      - "HONEY_BLOCK:8"
      - "TNT:4"
      - "COBWEB:4"
      - "HAY_BLOCK:8"
      - "NETHERRACK:16"
      - "SOUL_SAND:16"
      - "MAGMA_BLOCK:8"
      - "NETHER_BRICKS:16"
      - "GLOWSTONE:8"
      - "SEA_LANTERN:4"
      - "PACKED_ICE:8"
      - "BLUE_ICE:4"

      # Special
      - "ENDER_PEARL:2"
      - "EXPERIENCE_BOTTLE:4"
      - "CROSSBOW:1"

    rare:
      # Weapons
      - "DIAMOND_SWORD:1"
      - "DIAMOND_AXE:1"
      - "TRIDENT:1"

      # Armor
      - "DIAMOND_HELMET:1"
      - "DIAMOND_CHESTPLATE:1"
      - "DIAMOND_LEGGINGS:1"
      - "DIAMOND_BOOTS:1"
      - "ELYTRA:1"

      # Blocks
      - "DIAMOND_BLOCK:1"
      - "EMERALD_BLOCK:1"
      - "GOLD_BLOCK:2"
      - "ANCIENT_DEBRIS:1"
      - "CRYING_OBSIDIAN:4"
      - "END_STONE:16"
      - "PURPUR_BLOCK:16"
      - "END_STONE_BRICKS:16"
      - "SHROOMLIGHT:8"
      - "AMETHYST_BLOCK:4"
      - "BUDDING_AMETHYST:1"

      # Special
      - "ENCHANTED_GOLDEN_APPLE:1"
