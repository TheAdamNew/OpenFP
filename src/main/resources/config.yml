    # Drop chances (must add up to 100)
    chances:
      common: 60
      uncommon: 30
      rare: 10

  # Balanced mode loot (mid-tier only)
  balanced:
    items:
      # Weapons
      - "STONE_SWORD:1"
      - "IRON_SWORD:1"
      - "BOW:1"
      - "ARROW:32"

      # Armor
      - "CHAINMAIL_HELMET:1"
      - "CHAINMAIL_CHESTPLATE:1"
